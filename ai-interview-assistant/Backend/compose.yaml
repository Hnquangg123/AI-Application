name: ai_workshop

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-interview_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - interview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  interview_postgres_data:
